  docs/rules/base/coding_rule.md:
    title: Coding Rules
    purpose: "Defines Swift coding rules: staged implementation and refactoring steps, async initialization prohibition, naming conventions, layer and DI rules, data flow patterns, and logging usage"
    content_details:
      - "Staged implementation: one task at a time, build after each task, start from the least-dependent items"
      - "Refactoring procedure: list changes before implementing, keep each PR around 300 lines, verify build and tests at each stage"
      - "Async initialization prohibition: no Task inside init, use init async or an explicit initialization method"
      - "Acronym casing: uppercase acronyms such as userID, URLSession, UTF8, SMTPServer"
      - "Naming rules: Bool is/has prefixes, make prefix for factory methods, past participle for non-mutating and imperative verb for mutating methods, argument label omission, protocol suffixes"
      - "Tuple limit: at most 3 elements, use typealias when reused"
      - "Layer rules: ViewModel interacts only with Service and DataStore, App layer must not import DI, @Observable for SwiftUI integration"
      - "Data flow patterns: AsyncStream-based reactive update and direct-return pattern"
      - "Mock policy: no Service mocks, every Mock init calls MockAssertion.assertIfProductionOrStaging()"
      - "Logging: swift-log Logger with FileLogHandler in Sources/Logging and appropriate log level usage"
    applicable_tasks:
      - Swift code implementation following the coding conventions
      - Staged refactoring with reviewable changes
      - Naming review for types, methods, properties, and protocols
      - Async initialization design review
      - Layer dependency and DI design review
      - Mock and test double implementation review
      - Logging implementation review
    keywords:
      - async init
      - Task in init
      - acronym uppercase
      - mutating non-mutating naming
      - argument label omission
      - MockAssertion
      - FileLogHandler
      - Factory DI
      - ViewModel Service DataStore
      - staged refactoring
