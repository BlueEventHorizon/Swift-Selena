  docs/rules/base/coding_rule.md:
    title: Coding Rules
    purpose: "Defines Swift coding rules for Swift-Selena: incremental implementation and refactoring steps, async init prohibition, API naming for acronyms and booleans, layer dependencies, DI and Mock policy, swift-log usage."
    content_details:
      - "Incremental implementation rule: one task at a time, build after each task, start from low-dependency items"
      - "Refactoring rule: present change list before implementation, keep each PR under about 300 lines, UI changes last, build and test at each stage"
      - "Impact investigation: use Swift-Selena MCP to find all usages of types and symbols, fall back to Grep/Glob when unconnected"
      - "Async init prohibition: no Task inside init, use init async or explicit initialization method, with a bad example"
      - "Acronym naming: userID, URLSession, UTF8.CodeUnit, SMTPServer in all uppercase"
      - Bool property naming with is/has/shows prefixes, make prefix for factory methods
      - Non-mutating versus mutating method naming with past participle versus imperative verb, argument label omission and preposition rules
      - Tuple limit of up to 3 elements and typealias reuse, switch return rules by line count
      - ViewModel interacts only with Service and DataStore, ViewModel-Service connected by async/await or AsyncStream, App layer forbids import DI
      - "Mock policy: no Service mocks, every Mock init calls MockAssertion.assertIfProductionOrStaging, logging via swift-log Logger with FileLogHandler"
    applicable_tasks:
      - Swift code implementation planning
      - Refactoring change review and PR scoping
      - Swift naming convention review for new types and methods
      - Layer dependency and DI design review
      - Mock and test double implementation
      - Logging implementation with swift-log
      - Async initializer design review
    keywords:
      - coding rule
      - async init
      - Acronym naming
      - UPPERCASE acronyms
      - Mutating and non-mutating naming
      - Factory make prefix
      - MockAssertion
      - swift-log Logger
      - FileLogHandler
      - ViewModel Service DataStore
