      - Module listing excludes auxiliary enums, value objects, internal helpers, and extensions
      - "Required sections: overview, architecture diagram, module design, data flow, processing flow, state management, use cases, test case design"
      - "Principle: design describes How and requirements describe What; source code excluded except examples of 3-5 lines"
