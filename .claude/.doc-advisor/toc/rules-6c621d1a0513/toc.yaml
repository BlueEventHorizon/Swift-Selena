      - "Refactoring procedure for type and function changes: locate definition, check all references, check type hierarchy, change, then confirm zero old-name hits"
      - Deletion only after confirming zero references with search_code
      - "Verification patterns: analyze_imports for layer violations, search_code for MockAssertion, find_test_cases for test patterns"
      - "Duplicate code detection: consider moving code to Tools or Library when it appears in three or more places"
