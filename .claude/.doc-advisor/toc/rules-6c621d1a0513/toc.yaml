  docs/format/code_header_format.md:
    title: Code Header Format Specification
    purpose: Defines the standard Code Header Format comment for Swift files so Swift-Selena MCP can search and build the DB from them; covers section structure, required marker, writing rules, and generation method.
    content_details:
      - "Section structure: Purpose, Main features, Contained types (only when multiple types exist), Related types (only when applicable)"
      - Required marker [Code Header Format] placed after the Created by line and a blank line, used to detect formatted files
      - "Header syntax: two spaces after the comment slashes, matching existing headers"
      - Main features section lists capabilities without function or method names
      - "Exclusion rules: no function names, protocol conformances, usage examples, usage locations, constraints, keywords, or layers"
      - "Contained types format: type name followed by colon and a short description"
      - "Related types format: comma-separated Swift type names with parenthetical usage for external framework types"
      - "Generation method: read the whole file, understand implementation, consult tests and existing comments without trusting them blindly"
    applicable_tasks:
      - Creating Code Header Format comments for Swift files
      - Converting existing Swift file headers to Code Header Format
      - Reviewing Swift file headers for format compliance
      - Automating header generation with create-code-headers
