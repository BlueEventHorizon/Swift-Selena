  docs/format/spec_format.md:
    title: Requirements Document Format Rules
    purpose: Defines the unified format and writing rules for requirements documents (spec), including the What-only principle, the per-feature directory structure, the requirement ID scheme, file naming, and the document template.
    content_details:
      - "What-only principle: requirements describe user-visible behavior and rules, while How belongs in design documents"
      - Allowed content (user-visible features, business rules, data content, screen layout, error display, screen transitions) and forbidden content (class names, code examples, layer placement, data flow, test details)
      - "Decision criterion: write it only if it would appear in the user manual"
      - Directory layout project/{feature}/spec/ with categories screens, ui_components, functions, business_logic, non_functional, data_models, external_interfaces, navigation, theme
      - Required sections per category, e.g. screens need screen overview, layout, elements, functions, data needs, state needs and error handling
      - Requirement ID prefixes SCR-, CMP-, FNC-, BL-, NF-, DM-, EXT-, NAV-, THEME-, numbered from 001, never renumbered, deleted IDs left as gaps
      - File naming {ID}_{name}_spec.md in English snake_case, data_models uses _entity_spec.md
      - Standard template with metadata table, numbered overview and sections, and an unresolved items table with TBD-XXX IDs
      - "Diagram rules: ASCII for layout, Mermaid for screen and state transitions, lowercase end forbidden in flowcharts"
    applicable_tasks:
      - Creation of a new requirements document for a feature
      - Review of an existing requirements document against the format rules
      - Modification of requirements content to remove implementation details
      - Assignment of a requirement ID and file name for a new spec file
    keywords:
